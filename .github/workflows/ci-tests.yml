name: CI Quality Assurance

on:
  push:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        run: cd backend && mvn test
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      # Reads [tools].node from .mise.toml (setup-node >= v7) so local, CI and
      # container builds share one source of truth for the Node version.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Frontend Vitest
        run: cd frontend && npm test
      # Requires @playwright/test >= 1.61: older versions cannot install browsers on
      # ubuntu-26.04-x64, which GitHub is rolling out to `ubuntu-latest` until 2026-11-19.
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: cd frontend && npm run test:e2e
